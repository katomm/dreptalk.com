name = "dreptalk-com"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Custom domains. wrangler deploy provisions the DNS records and edge TLS
# certificates from the dreptalk.com zone (already active in this account).
# Both hostnames must reach the worker; www is redirected to the apex in
# src/middleware.ts so the canonical host stays https://dreptalk.com.
[[routes]]
pattern = "dreptalk.com"
custom_domain = true

[[routes]]
pattern = "www.dreptalk.com"
custom_domain = true

# Workers Static Assets: the Astro client build output (dist/client) is served
# as static assets, with the SSR worker handling everything else. The adapter
# emits the SSR bundle under dist/server and merges this config at build time.
[assets]
directory = "./dist/client"
binding = "ASSETS"

# D1 database for application data.
[[d1_databases]]
binding = "DB"
database_name = "dreptalk"
database_id = "4a84966c-9fde-49f7-bfed-9c3c927e5db3"
migrations_dir = "migrations"

# KV namespace for server-side session storage.
[[kv_namespaces]]
binding = "SESSIONS"
id = "2e999274a29a41319b3e1214653b4fee"

# KV namespace for ephemeral auth nonces (challenge-response).
[[kv_namespaces]]
binding = "NONCES"
id = "9b7873fb79c04d6eb34ec2fb2170a30b"

# ---------------------------------------------------------------------------
# Preprod app environment is NOT defined here as a [env.preprod] block. The
# @astrojs/cloudflare adapter regenerates the deploy config at build time
# (dist/server/wrangler.json) from the top level only and drops [env.*]
# bindings, so `wrangler deploy --env preprod` would ship the preprod worker
# with these mainnet D1/KV bindings. Instead, scripts/preprod-config.mjs
# derives a preprod config from the generated one (preprod worker name, D1, KV,
# route and CARDANO_NETWORK=preprod), and `npm run deploy` deploys it. The
# gov-sync worker has no adapter, so it uses a normal [env.preprod] block.
# ---------------------------------------------------------------------------
