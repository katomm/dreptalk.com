name = "dreptalk-com"
# Custom entry (src/worker.ts) so the RateLimiter Durable Object class is exported
# from this worker; it re-exports the DO and delegates SSR to the adapter's handle().
main = "./src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Custom domains. wrangler deploy provisions the DNS records and edge TLS
# certificates from the dreptalk.com zone (already active in this account).
# Both hostnames must reach the worker; www is redirected to the apex in
# src/middleware.ts so the canonical host stays https://dreptalk.com.
[[routes]]
pattern = "dreptalk.com"
custom_domain = true

[[routes]]
pattern = "www.dreptalk.com"
custom_domain = true

# Workers Static Assets: the Astro client build output (dist/client) is served
# as static assets, with the SSR worker handling everything else. The adapter
# emits the SSR bundle under dist/server and merges this config at build time.
[assets]
directory = "./dist/client"
binding = "ASSETS"

# Plain (non-secret) environment variables.
[vars]
# Web Push VAPID public key (base64url, uncompressed P-256 point), read by the
# settings page and handed to PushManager.subscribe(). Empty disables push in
# the settings UI. The real key pair is committed here at rollout; the matching
# private key is a secret (VAPID_PRIVATE_KEY), never stored in this file.
VAPID_PUBLIC_KEY = ""

# D1 database for application data.
[[d1_databases]]
binding = "DB"
database_name = "dreptalk"
database_id = "4a84966c-9fde-49f7-bfed-9c3c927e5db3"
migrations_dir = "migrations"

# R2 bucket holding self-hosted DRep avatars, written by the gov-sync avatar
# store pass and served by /api/avatar/<hash>. Content addressed by sha256.
[[r2_buckets]]
binding = "AVATARS"
bucket_name = "dreptalk-avatars"

# Cloudflare Images binding: downscales oversized avatar uploads to a WebP
# thumbnail before storing, instead of rejecting them. Requires Image
# Transformations enabled on the zone. Carried into the preprod config by
# scripts/preprod-config.mjs unchanged.
[images]
binding = "IMAGES"

# KV namespace for server-side session storage.
[[kv_namespaces]]
binding = "SESSIONS"
id = "2e999274a29a41319b3e1214653b4fee"

# Atomic rate-limit counters. One Durable Object instance per rate-limit key, so a
# key's increment is serialized and cannot be raced (unlike the prior KV counter).
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# ---------------------------------------------------------------------------
# Preprod app environment is NOT defined here as a [env.preprod] block. The
# @astrojs/cloudflare adapter regenerates the deploy config at build time
# (dist/server/wrangler.json) from the top level only and drops [env.*]
# bindings, so `wrangler deploy --env preprod` would ship the preprod worker
# with these mainnet D1/KV bindings. Instead, scripts/preprod-config.mjs
# derives a preprod config from the generated one (preprod worker name, D1, KV,
# route and CARDANO_NETWORK=preprod), and `npm run deploy` deploys it. The
# gov-sync worker has no adapter, so it uses a normal [env.preprod] block.
# ---------------------------------------------------------------------------
