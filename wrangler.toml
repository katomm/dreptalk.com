name = "dreptalk"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Workers Static Assets: the Astro client build output (dist/client) is served
# as static assets, with the SSR worker handling everything else. The adapter
# emits the SSR bundle under dist/server and merges this config at build time.
[assets]
directory = "./dist/client"
binding = "ASSETS"

# D1 database for application data.
# database_id is a placeholder; the real id is created at deploy time via
# `wrangler d1 create dreptalk` and must be set before deploying to production.
[[d1_databases]]
binding = "DB"
database_name = "dreptalk"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# KV namespace for server-side session storage.
# id is a placeholder; create with `wrangler kv namespace create SESSIONS` at deploy time.
[[kv_namespaces]]
binding = "SESSIONS"
id = "00000000000000000000000000000001"

# KV namespace for ephemeral auth nonces (challenge-response).
# id is a placeholder; create with `wrangler kv namespace create NONCES` at deploy time.
[[kv_namespaces]]
binding = "NONCES"
id = "00000000000000000000000000000002"
