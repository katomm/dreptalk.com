name = "dreptalk-gov-sync"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Shares the Pages/Workers app's D1 database. database_id must match the app's
# binding so local state and the remote database are the same one.
[[d1_databases]]
binding = "DB"
database_name = "dreptalk"
database_id = "4a84966c-9fde-49f7-bfed-9c3c927e5db3"
migrations_dir = "../../migrations"

# R2 bucket for self-hosted DRep avatars; written by the drep-sync avatar pass.
[[r2_buckets]]
binding = "AVATARS"
bucket_name = "dreptalk-avatars"

# Cloudflare Images binding: the avatar pass downscales oversized images to a
# WebP thumbnail before storing. Requires Image Transformations on the zone.
[images]
binding = "IMAGES"

# Three cron triggers (the expressions are mirrored as constants in
# src/lib/freshness.ts, which the worker dispatches on; keep them in sync):
#   */15 * * * *  governance discovery + active-action tallies (fast)
#   0 * * * *     per-post vote lists (hourly, active actions only)
#   0 */6 * * *   DRep sync (heavy: enumerates all DReps, runs every 6 h)
[triggers]
crons = ["*/15 * * * *", "0 * * * *", "0 */6 * * *"]

# CARDANO_NETWORK is intentionally NOT set here: unset defaults to mainnet in
# production. For local preprod runs, set it in workers/gov-sync/.dev.vars
# (gitignored) or pass --var CARDANO_NETWORK:preprod. KOIOS_API_KEY is an
# optional secret for higher rate limits.

# ---------------------------------------------------------------------------
# Preprod cron worker (dreptalk-gov-sync-preprod): mirrors the mainnet sync but
# polls preprod Koios and writes to the preprod D1, feeding preprod.dreptalk.com.
# Same cron cadence as mainnet. Deployed with
# `wrangler deploy -c workers/gov-sync/wrangler.toml --env preprod`.
# Triggers and bindings are not inherited from the top level, so they repeat.
# ---------------------------------------------------------------------------
[env.preprod]
name = "dreptalk-gov-sync-preprod"

[env.preprod.vars]
CARDANO_NETWORK = "preprod"

[[env.preprod.d1_databases]]
binding = "DB"
database_name = "dreptalk-preprod"
database_id = "adf2310b-b1c1-415a-b900-28dd56277cbb"
migrations_dir = "../../migrations"

[[env.preprod.r2_buckets]]
binding = "AVATARS"
bucket_name = "dreptalk-avatars-preprod"

[env.preprod.images]
binding = "IMAGES"

[env.preprod.triggers]
crons = ["*/15 * * * *", "0 * * * *", "0 */6 * * *"]
