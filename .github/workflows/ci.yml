name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A new push to the same PR cancels the now-outdated run instead of letting it finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Gate: Astro routes every supported file under src/pages except
      # underscore-prefixed ones, so a test file outside a __tests__/ dir becomes
      # a public production route. Cheap and dependency-free, so it runs first
      # and fails fast with a clear message.
      - name: Routed-pages guard
        run: |
          if find src/pages \( -name '*.test.*' -o -name '*.spec.*' \) ! -path '*/_*' | grep .; then
            echo 'These test files would be routed into the production Worker; put route tests in a colocated __tests__/ folder.'
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm run lint
      - run: npm test
      # Build the deployable artifact so packaging regressions fail CI, not production.
      - run: npm run build
      # Gate: the built artifact must stay free of test-runner imports (a routed
      # test file or a bundling regression would pull `cloudflare:test` into dist).
      - name: Built-artifact guard
        run: |
          if grep -rl 'cloudflare:test' dist/; then
            echo 'Built artifact contains test-runner imports.'
            exit 1
          fi
      # Gate: no static import cycles between chunks, server or browser. A cycle
      # makes module startup depend on which chunk a page loads first, and a
      # page can then crash on load with a helper that is not defined yet.
      - name: Chunk cycle guard
        run: npm run check:chunks
      # Gate: production dependencies must be free of high and critical vulnerabilities.
      # The deployed Workers runtime ships only the runtime deps (cborg, noble, blake, bech32, zod);
      # the Astro/adapter toolchain (undici, vitest, miniflare) is build/dev only.
      # After the Astro 6 / adapter 13 upgrade the previous undici high cleared,
      # so the gate is tightened from critical to high.
      - name: Audit production deps (gate on high)
        run: npm audit --omit=dev --audit-level=high
      # Informational: full audit for visibility, does not fail the build.
      - name: Full audit (informational)
        run: npm audit || true
  # Browser tests with a test CIP-30 wallet against the local dev server. The
  # server reads Koios from a local fixture server and the wallet only
  # simulates submits, so the job needs no secrets and touches no chain.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}
      # Skips the browser download on a cache hit, installs the system packages either way.
      - run: npx playwright install --with-deps chromium
      - run: cp e2e/dev.vars.example .dev.vars
      - run: npm run db:migrate:local
      - run: npm run db:seed:local
      - run: npm run db:seed:e2e
      - run: npm run test:e2e
      # Traces of the mock tier hold only the public default test mnemonic.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
