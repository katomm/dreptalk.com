name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Gate: production dependencies must be free of critical vulnerabilities.
      # The deployed Workers runtime ships only the runtime deps (cborg, noble, blake, bech32, zod);
      # the Astro/adapter toolchain (undici, vitest, miniflare) is build/dev only.
      - name: Audit production deps (gate on critical)
        run: npm audit --omit=dev --audit-level=critical
      # Informational: full audit for visibility, does not fail the build.
      - name: Full audit (informational)
        run: npm audit || true
