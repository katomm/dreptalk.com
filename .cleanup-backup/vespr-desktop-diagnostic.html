<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VESPR desktop connection diagnostic</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 64rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.25rem; }
  button { font: inherit; padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid #8888; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  select { font: inherit; padding: 0.3rem; }
  .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin: 0.6rem 0; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #8884; padding: 0.45rem 0.6rem; text-align: left; vertical-align: top; font-size: 13px; }
  th { background: #8881; }
  code { font-family: ui-monospace, monospace; word-break: break-all; }
  .ok { color: #1a7f37; font-weight: 600; }
  .fail { color: #cf222e; font-weight: 600; }
  .muted { color: #8a8a8a; }
  #log { white-space: pre-wrap; background: #8881; padding: 0.75rem; border-radius: 6px; font-family: ui-monospace, monospace; font-size: 12px; margin-top: 1rem; }
  .hint { background: #f0b72915; border: 1px solid #f0b72955; border-radius: 6px; padding: 0.6rem 0.8rem; font-size: 13px; }
</style>
</head>
<body>
<h1>VESPR desktop connection diagnostic</h1>
<p class="hint">
  Ziel: herausfinden, welcher Wallet-Aufruf den Fehler "Refused / lack of access" wirft.
  Vorher in VESPR: Wallet entsperren. Beim "Connect" das Popup wirklich bestaetigen.
</p>

<div class="row">
  <label>Wallet: <select id="wallet"></select></label>
  <label>Network:
    <select id="network">
      <option value="preprod" selected>preprod (testnet)</option>
      <option value="mainnet">mainnet</option>
    </select>
  </label>
  <button id="connect">Connect (enable + read sweep)</button>
  <button id="reenable" disabled>Re-enable</button>
</div>

<table id="sweep" hidden>
  <thead><tr><th>Call</th><th>Result</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<div class="row" id="signrow" hidden>
  <span>DRep key hash (bare CIP-95 DRep ID): <code id="keyhash"></code></span>
  <button id="sign" disabled>signData (bare DRep ID)</button>
  <span id="signres"></span>
</div>

<div id="log"></div>

<script type="module">
import { blake2b } from 'https://esm.sh/blakejs@1.2.1';
import { bech32 } from 'https://esm.sh/bech32@2.0.0';

const $ = (id) => document.getElementById(id);
const logEl = $('log');
const log = (...a) => { logEl.textContent += a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ') + '\n'; };

const enc = new TextEncoder();
const toHex = (b) => Array.from(b).map(x => x.toString(16).padStart(2, '0')).join('');
const hexToBytes = (h) => { const o = new Uint8Array(h.length / 2); for (let i = 0; i < o.length; i++) o[i] = parseInt(h.substr(i * 2, 2), 16); return o; };
const blake224 = (b) => blake2b(b, undefined, 28);

// Describe any thrown value: CIP-30 errors carry { code, info }.
function describeErr(e) {
  if (e && typeof e === 'object' && ('code' in e || 'info' in e)) {
    return `code=${e.code} info=${JSON.stringify(e.info ?? e.message ?? '')}`;
  }
  return String(e);
}

function listWallets() {
  const c = window.cardano;
  if (!c || typeof c !== 'object') return [];
  return Object.entries(c)
    .filter(([, w]) => w && typeof w === 'object' && typeof w.enable === 'function' && typeof w.name === 'string')
    .map(([key, w]) => ({ key, name: w.name, cip95: Array.isArray(w.supportedExtensions) && w.supportedExtensions.some(e => e.cip === 95), raw: w }));
}

function refreshWallets() {
  const sel = $('wallet');
  const found = listWallets();
  const prev = sel.value;
  sel.innerHTML = '';
  for (const w of found) {
    const o = document.createElement('option');
    o.value = w.key;
    o.textContent = `${w.name}${w.cip95 ? ' (CIP-95)' : ''} [${w.key}]`;
    sel.appendChild(o);
  }
  const vespr = found.find(w => /vespr/i.test(w.key) || /vespr/i.test(w.name));
  sel.value = found.some(w => w.key === prev) ? prev : (vespr ? vespr.key : (found[0]?.key ?? ''));
  return found;
}

let tries = 0;
const scan = setInterval(() => { refreshWallets(); if (++tries > 20) clearInterval(scan); }, 300);
window.addEventListener('load', refreshWallets);
refreshWallets();

let walletRaw = null;
let api = null;
let keyHashHex = '';

function addRow(call, cls, text) {
  const tr = document.createElement('tr');
  const c1 = document.createElement('td');
  c1.innerHTML = `<code>${call}</code>`;
  const c2 = document.createElement('td');
  c2.innerHTML = `<span class="${cls}">${cls === 'ok' ? 'OK' : 'FAILED'}</span> ${text}`;
  tr.appendChild(c1); tr.appendChild(c2);
  $('rows').appendChild(tr);
}

async function probe(call, fn) {
  try {
    const r = await fn();
    let shown = typeof r === 'string' ? r : JSON.stringify(r);
    if (shown && shown.length > 120) shown = shown.slice(0, 120) + '…';
    addRow(call, 'ok', `<code>${shown}</code>`);
    log(`${call}: OK -> ${shown}`);
    return { ok: true, value: r };
  } catch (e) {
    addRow(call, 'fail', `${describeErr(e)} <code>${JSON.stringify(e)}</code>`);
    log(`${call}: FAILED -> ${describeErr(e)} raw=${JSON.stringify(e)}`);
    return { ok: false, err: e };
  }
}

async function runConnect() {
  logEl.textContent = '';
  $('rows').innerHTML = '';
  $('sweep').hidden = false;
  $('signrow').hidden = true;
  $('sign').disabled = true;

  const info = listWallets().find(w => w.key === $('wallet').value);
  if (!info) { log('No wallet detected.'); return; }
  walletRaw = info.raw;
  log(`wallet=${info.key} reports CIP-95 support: ${info.cip95}`);

  // enable() is NOT access-gated; it establishes the grant.
  const en = await probe('enable({extensions:[{cip:95}]})', () => info.raw.enable({ extensions: [{ cip: 95 }] }));
  if (!en.ok) { log('enable failed; the rest cannot run.'); return; }
  api = en.value;
  $('reenable').disabled = false;

  // isEnabled() reports whether VESPR considers this origin connected.
  await probe('wallet.isEnabled()', () => info.raw.isEnabled());
  // getExtensions() shows whether cip95 was actually granted in this session.
  await probe('api.getExtensions()', () => api.getExtensions());
  // The following are access-gated; if access is refused they throw Refused (-3).
  await probe('api.getNetworkId()', () => api.getNetworkId());
  await probe('api.getUsedAddresses()', () => api.getUsedAddresses());
  await probe('api.getRewardAddresses()', () => api.getRewardAddresses());

  if (!api.cip95 || typeof api.cip95.getPubDRepKey !== 'function') {
    log('NOTE: api.cip95 missing -> CIP-95 was not granted on this enable.');
    return;
  }
  const k = await probe('api.cip95.getPubDRepKey()', () => api.cip95.getPubDRepKey());
  if (!k.ok) return;

  const drepKey = k.value;
  if (!/^[0-9a-fA-F]+$/.test(drepKey)) { log('getPubDRepKey not hex; stopping.'); return; }
  keyHashHex = toHex(blake224(hexToBytes(drepKey)));
  $('keyhash').textContent = keyHashHex;
  $('signrow').hidden = false;
  $('sign').disabled = false;
  log('Read sweep done. Click "signData (bare DRep ID)" to test the actual signing popup.');
}

$('connect').addEventListener('click', runConnect);

$('reenable').addEventListener('click', async () => {
  log('--- re-enable ---');
  await probe('enable({extensions:[{cip:95}]}) [retry]', async () => {
    api = await walletRaw.enable({ extensions: [{ cip: 95 }] });
    return 'enabled';
  });
  await probe('api.getNetworkId() [after re-enable]', () => api.getNetworkId());
  if (api.cip95?.getPubDRepKey) await probe('api.cip95.getPubDRepKey() [after re-enable]', () => api.cip95.getPubDRepKey());
});

$('sign').addEventListener('click', async () => {
  $('sign').disabled = true;
  $('signres').innerHTML = '<span class="muted">signing…</span>';
  const payloadHex = toHex(enc.encode('dreptalk.com login challenge: diagnostic'));
  const signer = (typeof api.cip95?.signData === 'function')
    ? { fn: api.cip95.signData.bind(api.cip95), label: 'cip95.signData' }
    : { fn: api.signData.bind(api), label: 'signData (base)' };
  log(`signing via ${signer.label} with bare DRep ID ${keyHashHex}`);
  try {
    const sig = await signer.fn(keyHashHex, payloadHex);
    $('signres').innerHTML = `<span class="ok">OK</span> signature ${sig.signature.slice(0, 30)}…`;
    log(`signData: OK key=${sig.key}`);
  } catch (e) {
    $('signres').innerHTML = `<span class="fail">FAILED</span> ${describeErr(e)}`;
    log(`signData: FAILED -> ${describeErr(e)} raw=${JSON.stringify(e)}`);
  } finally {
    $('sign').disabled = false;
  }
});
</script>
</body>
</html>
